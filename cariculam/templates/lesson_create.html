{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}Create lesson | Edu Friend{% endblock %}
{% block content %}
<div class="section-head">
  <h1>Create lesson</h1>
  <p class="lede">Tag foundation or advanced difficulty so Learning Path can recommend the right classes.</p>
</div>
<div class="panel form-panel" style="width:min(680px,100%);">
  <form method="post" enctype="multipart/form-data" class="form-stack">
    {% csrf_token %}
    {{ form|crispy }}
    <button class="btn btn-primary" type="submit">Save lesson</button>
  </form>
</div>
{% endblock %}
